[package]
name = "rgsx"
version = "0.1.0"
edition = "2021"
description = "Standalone cross-platform RGSX catalog browser and direct downloader"
license = "GPL-3.0-or-later"

[[bin]]
name = "rgsx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive", "env"] }
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
